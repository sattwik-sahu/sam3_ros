[develop]
script_dir=$base/lib/sam3_ros
[install]
install_scripts=$base/lib/sam3_ros

[flake8]
# ROS 2's ament_flake8 config already ignores the D1xx docstring rules.
# This project uses double quotes (black-compatible) and the import grouping
# style below, which the optional flake8-quotes/import-order plugins flag.
extend-ignore = Q000, I201
max-line-length = 99

[pydocstyle]
# Keep the ament ignore list in sync with test/test_pep257.py.
add-ignore = D213, D406, D407, D413
