[flake8]
# ament_flake8's default ignore list plus this project's choices:
# - Q000: the codebase follows black-style double quotes
# - I201: import groups are kept compact for readability
extend-ignore = B902,C816,D100,D101,D102,D103,D104,D105,D106,D107,D203,D212,D404,I202,Q000,I201,I100,A003
import-order-style = google
max-line-length = 99
show-source = true
statistics = true
