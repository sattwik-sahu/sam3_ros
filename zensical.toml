# Zensical documentation site.
# Build:  pixi run -e docs docs-build
# Serve:  pixi run -e docs docs-serve
# The docs environment contains only Python + Zensical; it never pulls ROS, CUDA
# or PyTorch.

[project]
site_name = "SAM 3 ROS"
site_url = "https://sattwik-sahu.github.io/sam3_ros/"
site_description = "Text-prompted SAM 3 segmentation for ROS 2 Jazzy: request/response server, streaming node, mono8 masks, Docker deployment and GPU benchmarks."
site_author = "moonlab"
copyright = "&copy; 2026 moonlab &middot; MIT"
repo_url = "https://github.com/sattwik-sahu/sam3_ros"
repo_name = "sattwik-sahu/sam3_ros"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"
extra_css = ["stylesheets/extra.css"]

nav = [
  { "Overview" = "index.md" },
  { "Install" = "install.md" },
  { "Server node" = "server.md" },
  { "Streaming node" = "streaming.md" },
  { "Parameters" = "parameters.md" },
  { "Docker" = "docker.md" },
  { "Benchmarks" = "benchmarks.md" },
  { "Examples" = "examples.md" },
  { "For agents" = "agents.md" },
]

[project.theme]
variant = "modern"
logo = "assets/logo.svg"
favicon = "assets/logo.svg"
language = "en"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "header.autohide",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "green"
accent = "green"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "green"
accent = "green"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/sattwik-sahu/sam3_ros"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
